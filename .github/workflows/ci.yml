name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          npm ci || npm install

      - name: Build frontend HUD and Obsidian plugin
        run: |
          npm run build --workspace=browser-client
          npm run build --workspace=obsidian-plugin

      - name: Test CLI diagnostics
        run: |
          node cli/bin/jarvis.mjs doctor
